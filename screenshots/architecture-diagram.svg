<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" style="background:#0a0e17; font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,monospace;">
  <defs>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1f2937" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Title & Header -->
  <text x="40" y="45" fill="#38bdf8" font-size="20" font-weight="bold" letter-spacing="1">ARINC 826 AVIONICS DATA LOADING OVER CONTROLLER AREA NETWORK (CAN)</text>
  <text x="40" y="70" fill="#94a3b8" font-size="12">ARINC 825 29-Bit Extended CAN Protocol • ISO 11898-2 High-Speed Flow Control • RTCA DO-178C DAL-A FADEC</text>
  <line x1="40" y1="85" x2="960" y2="85" stroke="#334155" stroke-width="1.5" />

  <!-- LOADER & GROUND SUPPORT DOMAIN (LEFT) -->
  <rect x="40" y="105" width="440" height="445" rx="8" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5" />
  <rect x="40" y="105" width="440" height="32" rx="8" fill="#1e293b" />
  <circle cx="60" cy="121" r="5" fill="#38bdf8" filter="url(#glow)" />
  <text x="75" y="126" fill="#38bdf8" font-size="13" font-weight="bold">ARINC 826 DATA LOADER (GSE / ONBOARD DATA LOADER)</text>

  <!-- ARINC 825 CAN Addressing -->
  <rect x="55" y="147" width="410" height="85" rx="4" fill="#0f172a" stroke="#10b981" stroke-width="1" />
  <text x="68" y="167" fill="#10b981" font-size="11" font-weight="bold">ARINC 825 29-Bit Extended CAN Identifier</text>
  <text x="68" y="184" fill="#f8fafc" font-size="10">Bits 28-26: Priority (Prio 2) • Bits 24-18: Service Code (0x12 Load)</text>
  <text x="68" y="200" fill="#94a3b8" font-size="10">Bits 17-11: Source Node ID (0x01 Loader) • Bits 10-4: Dest Node ID (0x1A EEC)</text>
  <text x="68" y="216" fill="#10b981" font-size="10">Bit 3: Req/Resp • Bits 2-0: Sub-Channel Control</text>

  <!-- Protocol State Machine -->
  <rect x="55" y="242" width="410" height="85" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
  <text x="68" y="262" fill="#38bdf8" font-size="11" font-weight="bold">7-Phase Protocol Lifecycle State Machine</text>
  <text x="68" y="280" fill="#f8fafc" font-size="10">IDLE -&gt; INIT -&gt; HEADER_TRANSFER -&gt; BLOCK_TRANSFER</text>
  <text x="68" y="296" fill="#94a3b8" font-size="10">-&gt; VERIFICATION (CRC-32) -&gt; COMMIT (Bank Toggle) / ABORT</text>
  <text x="68" y="312" fill="#38bdf8" font-size="10">Automatic state rollback on frame timeout or NACK</text>

  <!-- Flow Control Throttling -->
  <rect x="55" y="337" width="410" height="85" rx="4" fill="#0f172a" stroke="#f59e0b" stroke-width="1" />
  <text x="68" y="357" fill="#f59e0b" font-size="11" font-weight="bold">ISO 15765-2 Flow Control (FC) Throttling</text>
  <text x="68" y="375" fill="#f8fafc" font-size="10">Block Size (BS): 16 consecutive frames per block stream</text>
  <text x="68" y="391" fill="#94a3b8" font-size="10">Separation Time (STmin): 2.0 ms inter-frame pacing delay</text>
  <text x="68" y="407" fill="#f59e0b" font-size="10">Prevents buffer overrun in microcontroller RAM (TMS570 / Cortex-M4)</text>

  <!-- ARINC 429 Discrete Bus -->
  <rect x="55" y="432" width="410" height="105" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="68" y="452" fill="#94a3b8" font-size="11" font-weight="bold">ARINC 429 Glass-Cockpit Discrete Bus Output</text>
  <text x="68" y="472" fill="#38bdf8" font-size="10" font-family="monospace">Label 279: ARINC 826 Session State &amp; Interlocks Status [ODD OK]</text>
  <text x="68" y="492" fill="#38bdf8" font-size="10" font-family="monospace">Label 300: Transferred Blocks Count &amp; CAN Bitrate Key [ODD OK]</text>
  <text x="68" y="512" fill="#10b981" font-size="10" font-weight="bold">Bit 32 Odd Parity Integrity Verified on Both Words</text>

  <!-- TARGET AVIONICS LRU / FADEC DOMAIN (RIGHT) -->
  <rect x="520" y="105" width="440" height="445" rx="8" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.5" />
  <rect x="520" y="105" width="440" height="32" rx="8" fill="#1e293b" />
  <circle cx="540" cy="121" r="5" fill="#10b981" filter="url(#glow)" />
  <text x="555" y="126" fill="#10b981" font-size="13" font-weight="bold">TARGET AVIONICS LRU (FADEC / ENGINE CONTROLLER)</text>

  <!-- Physical CAN Controller -->
  <rect x="535" y="147" width="410" height="85" rx="4" fill="#0f172a" stroke="#10b981" stroke-width="1" />
  <text x="548" y="167" fill="#10b981" font-size="11" font-weight="bold">ISO 11898-2 High-Speed CAN Physical Interface</text>
  <text x="548" y="184" fill="#f8fafc" font-size="10">Active Bitrate: 1.0 Mbps High-Speed CAN (500 kbps / CAN FD 2M supported)</text>
  <text x="548" y="200" fill="#94a3b8" font-size="10">Differential 120-ohm termination • Hardware message mailbox filtering</text>
  <text x="548" y="216" fill="#10b981" font-size="10">Node ID: 0x1A (PW1000G / CFM LEAP FADEC Electronic Engine Control)</text>

  <!-- Ground Interlocks -->
  <rect x="535" y="242" width="410" height="85" rx="4" fill="#0f172a" stroke="#ef4444" stroke-width="1" />
  <text x="548" y="262" fill="#ef4444" font-size="11" font-weight="bold">FAR 25.1309 Ground Gate Safety Interlocks</text>
  <text x="548" y="280" fill="#f8fafc" font-size="10">Weight-on-Wheels (WOW) squat switch locked to Ground</text>
  <text x="548" y="296" fill="#94a3b8" font-size="10">Ground Speed strictly &lt; 0.1 kt • All engines completely shut down</text>
  <text x="548" y="312" fill="#ef4444" font-size="10">Inhibits CAN software flashing during flight or engine spool-up</text>

  <!-- Dual-Bank Flash Memory -->
  <rect x="535" y="337" width="410" height="85" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
  <text x="548" y="357" fill="#38bdf8" font-size="11" font-weight="bold">Dual-Bank Flash Memory &amp; Lossless Fallback</text>
  <text x="548" y="375" fill="#f8fafc" font-size="10">Bank A: Active Flight Execution (PW FADEC OFP v12.4.1)</text>
  <text x="548" y="391" fill="#94a3b8" font-size="10">Bank B: Staging Target Flash (512 kB / 64 Blocks)</text>
  <text x="548" y="407" fill="#38bdf8" font-size="10">Atomic bank toggle occurs only after 100% CRC-32 verification</text>

  <!-- Normative Compliance Scorecard -->
  <rect x="535" y="432" width="410" height="105" rx="4" fill="#0f172a" stroke="#10b981" stroke-width="1" />
  <text x="548" y="452" fill="#10b981" font-size="11" font-weight="bold">10-Point Normative Compliance Certification</text>
  <text x="548" y="472" fill="#f8fafc" font-size="10">ARINC Specification 826-1 • ARINC 825 (CAN in Avionics)</text>
  <text x="548" y="492" fill="#f8fafc" font-size="10">ISO 11898-2 • RTCA DO-178C (DAL-A) • FAA AC 20-115D</text>
  <text x="548" y="512" fill="#10b981" font-size="11" font-weight="bold">10 / 10 CHECKS PASSED (100% ARINC_826_CAN_LOADER_CERTIFIED)</text>

  <!-- Footer Banner -->
  <text x="500" y="575" fill="#64748b" font-size="11" text-anchor="middle">ARINC826Forge Pro v1.0.0 • Compliant with ARINC 826-1, ARINC 825, ISO 11898-2, RTCA DO-178C DAL-A &amp; FAA AC 20-115D</text>
</svg>